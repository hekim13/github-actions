name: Run .NET tests

on:
  workflow_call:
    inputs:
      dotnet_version:
        type: string
        default: '10.0.x'

      working_directory:
        type: string
        default: '.'

      solution_path:
        description: 'Solution or project path, relative to working_directory. Empty uses automatic discovery.'
        type: string
        default: ''

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DOTNET_TEST_SOLUTION: ${{ inputs.solution_path }}

    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}

    steps:
      - name: Checkout git repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: Restore
        run: |
          target=()
          if [[ -n "$DOTNET_TEST_SOLUTION" ]]; then
            target+=("$DOTNET_TEST_SOLUTION")
          fi
          dotnet restore "${target[@]}"

      - name: Build
        run: |
          target=()
          if [[ -n "$DOTNET_TEST_SOLUTION" ]]; then
            target+=("$DOTNET_TEST_SOLUTION")
          fi
          dotnet build --configuration Release --no-restore "${target[@]}"

      - name: Run tests
        run: |
          target=()
          if [[ -n "$DOTNET_TEST_SOLUTION" ]]; then
            target+=("$DOTNET_TEST_SOLUTION")
          fi
          dotnet test --configuration Release --no-build "${target[@]}"
