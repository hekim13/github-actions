name: Build and push GHCR image

on:
  workflow_call:
    inputs:
      docker_context:
        type: string
        default: .

      dockerfile_path:
        type: string
        default: './Dockerfile'

      tag_suffix:
        type: string

      platform:
        required: true
        type: string

      use_scan:
        type: boolean
        default: true

jobs:
  build-and-push-docker-image:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout git repository
        uses: actions/checkout@v7

      - name: Get GHCR repository
        id: repository
        shell: bash
        run: |
          REPOSITORY="ghcr.io/${GITHUB_REPOSITORY,,}"

          echo "repository=${REPOSITORY}" >> "$GITHUB_OUTPUT"
          echo "GHCR repository: ${REPOSITORY}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Docker tags
        id: gettags
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            PRIMARY_TAG="pr-${{ github.event.pull_request.number }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            PRIMARY_TAG="${GITHUB_REF#refs/tags/v}"
          elif [[ "${GITHUB_REF}" == "refs/heads/master" ]]; then
            PRIMARY_TAG="latest"
          else
            echo "Unsupported GitHub ref: ${GITHUB_REF}"
            exit 1
          fi

          SHA_TAG="sha-${GITHUB_SHA::7}"

          if [[ -n "${{ inputs.tag_suffix }}" ]]; then
            PRIMARY_TAG="${PRIMARY_TAG}-${{ inputs.tag_suffix }}"
            SHA_TAG="${SHA_TAG}-${{ inputs.tag_suffix }}"
          fi

          echo "primary_tag=${PRIMARY_TAG}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"

          {
            echo "tags<<EOF"
            echo "${{ steps.repository.outputs.repository }}:${PRIMARY_TAG}"
            echo "${{ steps.repository.outputs.repository }}:${SHA_TAG}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Get metadata
        id: getmetadata
        shell: bash
        run: |
          echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      #
      # Trivy scan
      #
      # Build a single-platform image locally so it can be scanned
      # without pushing a temporary image to GHCR.
      #
      - name: Build Docker image for Trivy scan
        if: ${{ inputs.use_scan == true }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.docker_context }}
          file: ${{ inputs.dockerfile_path }}
          platforms: linux/amd64
          load: true
          push: false
          tags: local/trivy-scan:${{ steps.gettags.outputs.primary_tag }}

      - name: Run Trivy vulnerability scanner
        if: ${{ inputs.use_scan == true }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'local/trivy-scan:${{ steps.gettags.outputs.primary_tag }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      #
      # Production / test image
      #
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.docker_context }}
          file: ${{ inputs.dockerfile_path }}
          platforms: ${{ inputs.platform }}
          push: true
          cache-from: type=registry,ref=${{ steps.repository.outputs.repository }}:${{ steps.gettags.outputs.primary_tag }}
          cache-to: type=inline
          tags: ${{ steps.gettags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.created=${{ steps.getmetadata.outputs.created }}
            org.opencontainers.image.revision=${{ github.sha }}
